<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#ffffff">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Comedor NFC</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <main id="view"></main>

    <nav id="tabs">
      <button class="tab active" data-tab="scan" onclick="App.setTab('scan')">
        <span class="tab-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
            <circle cx="12" cy="12" r="2" fill="currentColor" stroke="none"/>
            <path d="M8 12a4 4 0 0 1 8 0"/>
            <path d="M4.5 12a7.5 7.5 0 0 1 15 0"/>
          </svg>
        </span>
        <span class="tab-label">Escaneo</span>
      </button>

      <button class="tab" data-tab="historial" onclick="App.setTab('historial')">
        <span class="tab-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
            <line x1="8" y1="6"  x2="20" y2="6"/>
            <line x1="8" y1="12" x2="20" y2="12"/>
            <line x1="8" y1="18" x2="20" y2="18"/>
            <circle cx="4" cy="6"  r="1" fill="currentColor" stroke="none"/>
            <circle cx="4" cy="12" r="1" fill="currentColor" stroke="none"/>
            <circle cx="4" cy="18" r="1" fill="currentColor" stroke="none"/>
          </svg>
        </span>
        <span class="tab-label">Historial</span>
      </button>

      <button class="tab" data-tab="personal" onclick="App.setTab('personal')">
        <span class="tab-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
        </span>
        <span class="tab-label">Personal</span>
      </button>
    </nav>
  </div>

  <div id="toast-container"></div>

  <div id="modal-overlay" class="hidden" onclick="App.closeModal()">
    <div id="modal-box" onclick="event.stopPropagation()">
      <div id="modal-content"></div>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script src="js/scan.js"></script>
  <script src="js/historial.js"></script>
  <script src="js/personal.js"></script>
</body>
</html>
